name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Install dependencies
      run: npm ci

    - name: Lint HTML
      run: npm run lint:html

    - name: Lint CSS
      run: npm run lint:css

    - name: Lint JavaScript
      run: npm run lint:js

    - name: Test
      run: npm test

    - name: Test Go
      working-directory: cmd/airports
      run: go test ./...
